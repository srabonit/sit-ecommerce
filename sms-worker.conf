/etc/supervisor/conf.d/

sudo nano /etc/supervisor/conf.d/sms-worker.conf

[program:sms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/your-project/artisan queue:work --queue=sms-notifications,sms-campaigns,sms-dlr,default --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/your-project/storage/logs/sms-worker.log
stopwaitsecs=3600